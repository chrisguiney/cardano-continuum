\* SPEC: SubmitRetry.tla
\* The unmutated rules with one restart at any point, and no outside spend.
\* Safety only; RetryRestartLive checks the liveness at the same bounds.
\* Expected: every invariant and action property holds.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 0
    MaxRestarts = 1
    Recovery = "rebuild"
    Mutation = "none"
INVARIANTS
    TypeOK
    IntentAtMostOnce
    DeadIsDead
    SettledIsFinal
    AttemptsBounded
    OracleSound
    SlotsSuffice
PROPERTIES
    NoRegression
    FinalIsFinal
