\* SPEC: SubmitRetry.tla
\* The unmutated rules with one restart at any point, and no outside spend.
\* Expected: every invariant and every property holds.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 0
    MaxRestarts = 1
    Mutation = "none"
INVARIANTS
    TypeOK
    IntentAtMostOnce
    DeadIsDead
    SettledIsFinal
    AttemptsBounded
    OracleSound
    SlotsSuffice
PROPERTIES
    NoRegression
    FinalIsFinal
    Terminates
    AttemptsEnd
