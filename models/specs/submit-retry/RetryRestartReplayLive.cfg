\* SPEC: SubmitRetry.tla
\* RetryRestartReplay's bounds with the machine, the planner and time fair
\* (FairSpec). Liveness only; RetryRestartReplay checks the safety
\* properties.
\* Expected: Terminates and AttemptsEnd hold.
SPECIFICATION FairSpec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 0
    MaxRestarts = 1
    Recovery = "replay"
    Mutation = "none"
PROPERTIES
    Terminates
    AttemptsEnd
