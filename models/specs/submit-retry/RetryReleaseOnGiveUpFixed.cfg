\* SPEC: SubmitRetry.tla
\* RetryReleaseOnGiveUpBug's bounds (patience of two, all three mistake
\* kinds) with the rule as the code has it: giving up releases nothing, and
\* the attempts stay unfinished until the planner settles or writes them off.
\* Expected: every invariant and action property holds.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 2
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "none"
INVARIANTS
    TypeOK
    IntentAtMostOnce
    DeadIsDead
    SettledIsFinal
    AttemptsBounded
    OracleSound
    SlotsSuffice
PROPERTIES
    NoRegression
    FinalIsFinal
