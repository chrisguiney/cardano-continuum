\* SPEC: SubmitRetry.tla
\* Mutates: a rollback resets the submission counter. Should violate:
\* AttemptsBounded. The actor submits more often than its patience allows.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Mutation = "ResetOnRollback"
INVARIANTS
    AttemptsBounded
