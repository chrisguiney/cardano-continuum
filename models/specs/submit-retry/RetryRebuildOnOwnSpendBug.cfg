\* SPEC: SubmitRetry.tla
\* Mutates: any rejection writes the attempt off, including the 'inputs
\* spent' answer a node gives to a resubmit of bytes already in a block.
\* Should violate: IntentAtMostOnce. The write-off frees the intent to
\* rebuild on fresh inputs, and both attempts land.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "RefuseOnSpent"
INVARIANTS
    IntentAtMostOnce
