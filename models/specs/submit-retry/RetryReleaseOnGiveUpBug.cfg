\* SPEC: SubmitRetry.tla
\* Mutates: giving up writes every unfinished attempt off at once instead of
\* waiting for settled expiry. Should violate: DeadIsDead. A written-off
\* attempt is still in a mempool and can land.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 2
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "ReleaseOnGiveUp"
INVARIANTS
    DeadIsDead
