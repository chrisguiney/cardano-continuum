\* SPEC: SubmitRetry.tla
\* Mutates: an attempt is never written off for its time-to-live.
\* Should violate: AttemptsEnd. A sent attempt no node ever includes stays
\* live for ever, though its machine gives up.
SPECIFICATION FairSpec
\* The given-up machine holding that attempt has no step and would be
\* reported as a deadlock first; AttemptsEnd is the property this config
\* gives teeth, and it covers the same stuck state.
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "NoExpiry"
PROPERTIES
    AttemptsEnd
