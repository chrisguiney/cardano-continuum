\* SPEC: SubmitRetry.tla
\* Mutates: the engine's restart does not mark an interrupted send as
\* possibly sent. Should violate: IntentAtMostOnce. The resend's 'inputs
\* spent' then reads as a refusal.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 1
    Recovery = "replay"
    Mutation = "RestartForgetsSent"
INVARIANTS
    IntentAtMostOnce
