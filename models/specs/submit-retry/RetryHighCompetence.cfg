\* SPEC: SubmitRetry.tla
\* The unmutated rules with a competent actor: every diagnosis names a class
\* the node reported.
\* Safety only; RetryHighCompetenceLive checks the liveness at the same
\* bounds.
\* Expected: every invariant and action property holds.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "high"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "none"
INVARIANTS
    TypeOK
    IntentAtMostOnce
    DeadIsDead
    SettledIsFinal
    AttemptsBounded
    OracleSound
    SlotsSuffice
PROPERTIES
    NoRegression
    FinalIsFinal
