\* SPEC: SubmitRetry.tla
\* Mutates: the oracle expects one class, for the first injected mistake, not
\* one per mistake. Should violate: OracleSound. A node checking the rules in
\* another order names the other mistake.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "SingleExpected"
INVARIANTS
    OracleSound
