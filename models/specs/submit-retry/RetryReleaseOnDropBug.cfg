\* SPEC: SubmitRetry.tla
\* Mutates: a drop notice writes the attempt off before the rebuild. Should
\* violate: IntentAtMostOnce. The 'dropped' attempt was in a block the
\* planner had not seen.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "ReleaseOnDrop"
INVARIANTS
    IntentAtMostOnce
