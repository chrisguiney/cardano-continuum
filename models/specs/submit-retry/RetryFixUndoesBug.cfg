\* SPEC: SubmitRetry.tla
\* Mutates: a fix replaces the earlier fixes instead of adding to them. A
\* competent actor fixes one of two mistakes, then the other, and the first
\* comes back. Should violate: NoRegression.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "high"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "FixUndoes"
PROPERTIES
    NoRegression
