\* SPEC: SubmitRetry.tla
\* Mutates: the oracle forgets that the attempt was sent before, so it treats
\* a resubmit as a fresh transaction. Should violate: OracleSound. The node
\* answers 'inputs spent' to bytes in its own mempool.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "OracleIgnoresResubmit"
INVARIANTS
    OracleSound
