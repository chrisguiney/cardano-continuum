\* SPEC: SubmitRetry.tla
\* Mutates: after a restart, unfinished attempts are treated as never sent
\* and the newest is sent again. Should violate: IntentAtMostOnce. The
\* resubmit's 'inputs spent' then reads as a refusal.
SPECIFICATION Spec
\* Forgetting that an attempt was sent also leaves it unexpirable: after a
\* give-up and a restart it is live for ever with nothing to do, a
\* deadlock TLC finds before the double payment. The check is off so this
\* config reports the payment; RetryRestartForgetsSentStuckBug reports the
\* deadlock.
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 1
    Recovery = "rebuild"
    Mutation = "RestartForgetsSent"
INVARIANTS
    IntentAtMostOnce
