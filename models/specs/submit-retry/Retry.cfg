\* SPEC: SubmitRetry.tla
\* The unmutated rules at the base bounds: one intent, three record slots,
\* patience of three submissions, a low-competence actor, all three mistake
\* kinds, one rollback, one eviction, one outside spend, no restart.
\* Expected: every invariant and every property holds.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Mutation = "none"
INVARIANTS
    TypeOK
    IntentAtMostOnce
    DeadIsDead
    SettledIsFinal
    AttemptsBounded
    OracleSound
    SlotsSuffice
PROPERTIES
    NoRegression
    FinalIsFinal
    Terminates
    AttemptsEnd
