\* SPEC: SubmitRetry.tla
\* As RetryRestart, with the engine's restart: checkpoint and log restore
\* every machine, and only an interrupted send counts as sent.
\* Expected: every invariant and every property holds.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 0
    MaxRestarts = 1
    Recovery = "replay"
    Mutation = "none"
INVARIANTS
    TypeOK
    IntentAtMostOnce
    DeadIsDead
    SettledIsFinal
    AttemptsBounded
    OracleSound
    SlotsSuffice
PROPERTIES
    NoRegression
    FinalIsFinal
    Terminates
    AttemptsEnd
