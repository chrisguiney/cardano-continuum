\* SPEC: SubmitRetry.tla
\* Mutates: the write-off is decided from the actor's diagnosis, not the
\* node's answer. A low-competence actor reads 'inputs spent' as a fee error.
\* Should violate: IntentAtMostOnce.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "RefuseOnDiagnosis"
INVARIANTS
    IntentAtMostOnce
