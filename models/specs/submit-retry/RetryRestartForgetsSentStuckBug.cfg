\* SPEC: SubmitRetry.tla
\* Mutates: as RetryRestartForgetsSentBug, a restart treats unfinished
\* attempts as never sent.
\* Should deadlock: an attempt sent with no answer, whose actor gave up, is
\* never written off after the restart, since only a sent attempt expires.
\* EXPECT: Deadlock
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 1
    Recovery = "rebuild"
    Mutation = "RestartForgetsSent"
