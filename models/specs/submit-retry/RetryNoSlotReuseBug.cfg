\* SPEC: SubmitRetry.tla
\* Mutates: a record slot is never reused, even when its attempt is dead
\* and can never land. Two slots for a patience of three.
\* Should violate: SlotsSuffice. A third build the actor's patience allows
\* finds no slot.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 2
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "NoSlotReuse"
INVARIANTS
    SlotsSuffice
