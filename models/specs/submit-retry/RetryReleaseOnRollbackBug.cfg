\* SPEC: SubmitRetry.tla
\* Mutates: a rollback writes the attempt off and rebuilds. Should violate:
\* IntentAtMostOnce. The rolled-back bytes are included again.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "ReleaseOnRollback"
INVARIANTS
    IntentAtMostOnce
