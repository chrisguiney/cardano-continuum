\* SPEC: SubmitRetry.tla
\* Mutates: no attempt cap; the actor never gives up. Should violate:
\* Terminates. Some retry loop (an attempt the node never includes expires
\* and is rebuilt; a misdiagnosis repeats; a node never answers) runs
\* forever. Fixed counters keep the state space finite.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 0
    MaxEvictions = 0
    MaxAdv = 0
    MaxRestarts = 0
    Mutation = "NoCap"
PROPERTIES
    Terminates
