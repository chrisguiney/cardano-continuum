\* SPEC: SubmitRetry.tla
\* Two intents, two record slots each, patience of two, the stale-input
\* mistake only (it shares a class with "my attempt is in a block"), one
\* rollback, one restart.
\* Intents share no input here (the planner model checks that), so this
\* checks that a restart and the two machines keep them apart. Safety only:
\* liveness is per intent and Retry checks it.
\* Expected: every invariant holds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 2
    MaxSlots = 2
    Patience = 2
    Competence = "low"
    Mistakes = {"Stale"}
    MaxRollbacks = 1
    MaxEvictions = 0
    MaxAdv = 0
    MaxRestarts = 1
    Recovery = "rebuild"
    Mutation = "none"
INVARIANTS
    TypeOK
    IntentAtMostOnce
    DeadIsDead
    SettledIsFinal
    AttemptsBounded
    OracleSound
    SlotsSuffice
PROPERTIES
    NoRegression
    FinalIsFinal
