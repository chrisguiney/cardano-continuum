\* SPEC: SubmitRetry.tla
\* Mutates: a restart rebuilds every machine from the records, a finished
\* one too.
\* Should violate: FinalIsFinal. An intent given up on, with an attempt
\* still unfinished, is sent again after the restart.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 0
    MaxRestarts = 1
    Recovery = "rebuild"
    Mutation = "RestartReopens"
PROPERTIES
    FinalIsFinal
