\* SPEC: SubmitRetry.tla
\* Probe, no mutation: a resubmit is answered 'inputs spent' while its own
\* bytes are in a block. Should violate: ProbeNoResubmitMempoolFailure (the
\* model can reach the state the probe denies).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Mutation = "none"
INVARIANTS
    ProbeNoResubmitMempoolFailure
