\* SPEC: SubmitRetry.tla
\* Mutates: a rebuild picks its inputs without Reserve's rule that it
\* conflict with every unfinished attempt. Should violate: IntentAtMostOnce.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "BypassReserve"
INVARIANTS
    IntentAtMostOnce
