\* SPEC: SubmitRetry.tla
\* Mutates: the planner settles an attempt as soon as its view has it in a
\* block, not K deep.
\* Should violate: SettledIsFinal. The block can still roll back.
SPECIFICATION Spec
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "SettleOnBlock"
INVARIANTS
    SettledIsFinal
