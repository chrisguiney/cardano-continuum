\* SPEC: SubmitRetry.tla
\* Mutates: a submission with no answer (timeout, closed connection) writes
\* the attempt off. Should violate: IntentAtMostOnce. The bytes had arrived.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumIntents = 1
    MaxSlots = 3
    Patience = 3
    Competence = "low"
    Mistakes = {"Fee", "Signer", "Stale"}
    MaxRollbacks = 1
    MaxEvictions = 1
    MaxAdv = 1
    MaxRestarts = 0
    Recovery = "rebuild"
    Mutation = "RefuseOnUnreached"
INVARIANTS
    IntentAtMostOnce
