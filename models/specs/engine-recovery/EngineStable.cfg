\* SPEC: EngineRecovery.tla
\* Design A (durable actor state from K-deep blocks only, no undo): every
\* crash point, offline rollback and restart keeps the store consistent,
\* replayable and on the chain. Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Actors = {"a1"}
    K = 2
    MaxLen = 4
    MaxRollbacks = 2
    MaxCrashes = 2
    MaxTicks = 1
    MaxBatch = 1
    Variant = "Stable"
    Mutation = "none"
INVARIANTS
    TypeOK
    NeverHalted
    CursorAgrees
    MemConsistent
    LogBeforeEffect
    CheckpointConsistent
    ReplayReproduces
    StoreMatchesChain
    StableOnly
