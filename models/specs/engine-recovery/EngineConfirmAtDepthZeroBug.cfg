\* SPEC: EngineRecovery.tla
\* Mutation: design A mis-implemented: blocks are counted into durable actor
\* state at depth 0 (the tip), with no undo. A node rollback then leaves a
\* counted block off the chain. Expected: StableOnly is violated.
SPECIFICATION Spec
CONSTANTS
    Actors = {"a1"}
    K = 2
    MaxLen = 4
    MaxRollbacks = 2
    MaxCrashes = 2
    MaxTicks = 1
    MaxBatch = 1
    Variant = "Stable"
    Mutation = "ConfirmAtDepthZero"
INVARIANTS
    StableOnly
