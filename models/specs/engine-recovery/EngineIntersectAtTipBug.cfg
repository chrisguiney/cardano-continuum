\* SPEC: EngineRecovery.tla
\* Mutation: on restart the engine assumes its stored tip still exists and
\* ignores the older intersection the node answers with, so its points and
\* the node's read pointer for it diverge. Expected: CursorAgrees is violated.
SPECIFICATION Spec
CONSTANTS
    Actors = {"a1"}
    K = 2
    MaxLen = 4
    MaxRollbacks = 2
    MaxCrashes = 2
    MaxTicks = 1
    MaxBatch = 1
    Variant = "Stable"
    Mutation = "IntersectAtTip"
INVARIANTS
    CursorAgrees
