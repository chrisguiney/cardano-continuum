\* SPEC: EngineRecovery.tla
\* Mutation: the checkpoint writes the points and log seq in one transaction
\* and the actor state in a second; a crash between them leaves the cursor
\* ahead of the state. Expected: CheckpointConsistent is violated.
SPECIFICATION Spec
CONSTANTS
    Actors = {"a1"}
    K = 2
    MaxLen = 4
    MaxRollbacks = 2
    MaxCrashes = 2
    MaxTicks = 1
    MaxBatch = 1
    Variant = "Stable"
    Mutation = "SplitCommit"
INVARIANTS
    CheckpointConsistent
