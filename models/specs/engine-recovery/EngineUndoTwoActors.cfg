\* SPEC: EngineRecovery.tla
\* Two actors, so the counters of different actors must not mix, at a
\* shorter chain (3 blocks) and one node rollback to stay within budget.
\* Design B (actor state from every block, durable undo for the last K):
\* every crash point, offline rollback and restart keeps the store
\* consistent and replayable, and the undo window covers every rollback.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Actors = {"a1", "a2"}
    K = 2
    MaxLen = 3
    MaxRollbacks = 1
    MaxCrashes = 2
    MaxTicks = 1
    MaxBatch = 1
    Variant = "Undo"
    Mutation = "none"
INVARIANTS
    TypeOK
    NeverHalted
    CursorAgrees
    MemConsistent
    LogBeforeEffect
    CheckpointConsistent
    ReplayReproduces
    StoreMatchesChain
    UndoCoversWindow
