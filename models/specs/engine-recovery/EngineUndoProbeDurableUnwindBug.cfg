\* SPEC: EngineRecovery.tla
\* Probe (design B): a restart can find durable actor effects from blocks the
\* node has dropped, which it must unwind from stored undo. Expected:
\* ProbeNoDurableUnwind is violated.
SPECIFICATION Spec
CONSTANTS
    Actors = {"a1"}
    K = 2
    MaxLen = 4
    MaxRollbacks = 2
    MaxCrashes = 2
    MaxTicks = 1
    MaxBatch = 1
    Variant = "Undo"
    Mutation = "none"
INVARIANTS
    ProbeNoDurableUnwind
