\* SPEC: DexContention.tla
\* Mutates rule 1: a rebuild spends the pool output the view now has but
\* computes the new pool from the datum its first attempt read. Should
\* violate: CollateralSafe. The rebuild passes phase 1 and fails the pool
\* validator, forfeiting collateral.
SPECIFICATION Spec
CONSTANTS
    Actors = {a1, a2, a3}
    Patience = 2
    MaxRollbacks = 1
    Mutation = "stale_datum"
INVARIANT
    CollateralSafe
