\* SPEC: FiatEscrow.tla
\* The unmutated rules: two orders, one payday, one bill, one restart.
\* Safety only; FiatEscrowLive checks that every order ends.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Orders = {o1, o2}
    Cents = 2
    Fiat0 = 3
    Income = 2
    Expense = 2
    Paydays = 1
    Bills = 1
    Restarts = 1
    Mutation = "none"
INVARIANTS
    TypeOK
    AvailableNonNegative
    Conservation
    HoldsMatchOpenOrders
