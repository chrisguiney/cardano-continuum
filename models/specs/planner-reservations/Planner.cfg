\* SPEC: PlannerReservations.tla
\* The unmutated rule at the base bounds: two genesis outputs, three
\* transactions, two intents, K = 1, a chain of up to three blocks, one
\* rollback, one outside spend, one mempool eviction, one failed submission,
\* no restart.
\* Expected: every invariant holds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    SettledViewIsChain
    ReservedWhileUnfinished
    NoLeak
    InputsTracked
    DeadIsDead
    SettledIsFinal
    NoSelfConflict
    IntentAtMostOnce
