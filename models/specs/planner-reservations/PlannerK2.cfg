\* SPEC: PlannerReservations.tla
\* The unmutated rule with K = 2: rollbacks of one or two blocks, a chain of
\* up to four blocks, a time-to-live of three blocks.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 2
    TtlDelta = 3
    MaxChain = 4
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    SettledViewIsChain
    ReservedWhileUnfinished
    NoLeak
    InputsTracked
    DeadIsDead
    SettledIsFinal
    NoSelfConflict
    IntentAtMostOnce
