\* SPEC: PlannerReservations.tla
\* Mutates: a transaction is handed to a node while its record and
\* reservations are still only in memory.
\* Should violate: IntentAtMostOnce. A restart forgets a transaction that is
\* in the network; the intent is built again from scratch and both land.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 0
    MaxRestarts = 1
    RebuildNeedsDrop = TRUE
    Mutation = "PersistLate"
INVARIANTS
    IntentAtMostOnce
