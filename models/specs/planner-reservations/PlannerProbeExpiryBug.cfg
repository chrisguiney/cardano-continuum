\* SPEC: PlannerReservations.tla
\* Probe, no mutation: a transaction that reached a node is written off by
\* its time-to-live alone. One transaction, three genesis outputs and two
\* outside spends, so two blocks can pass without it.
\* Should violate: ProbeNoExpiry (the model can reach the state the probe
\* denies).
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 3
    MaxTx = 1
    NumIntents = 1
    K = 1
    TtlDelta = 1
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 2
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "none"
INVARIANTS
    ProbeNoExpiry
