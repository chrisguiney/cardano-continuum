\* SPEC: PlannerReservations.tla
\* Mutates: as PlannerNoCascadeBug, the transactions built on one written
\* off are left alone.
\* Should violate: Finishes. A descendant that can never land is never
\* written off.
SPECIFICATION LiveSpec
\* The caught-up planner holding that descendant has no step and would be
\* reported as a deadlock first; Finishes is the property this config
\* gives teeth, and it covers the same stuck state.
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "NoCascade"
PROPERTIES
    Finishes
