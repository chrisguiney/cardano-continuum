\* SPEC: PlannerReservations.tla
\* Mutates: the same as PlannerSettleAtTipBug.
\* Should violate: NoSelfConflict. After the rollback the inputs are unspent
\* in the view and unreserved; another intent is handed them while the first
\* transaction can be included again.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "SettleAtTip"
INVARIANTS
    NoSelfConflict
