\* SPEC: PlannerReservations.tla
\* Mutates: a transaction is written off as soon as the view shows one of its
\* inputs spent by something else, at any depth.
\* Should violate: NoSelfConflict. The spending block is rolled back and the
\* transaction is included after its other input went to another intent.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "DeadOnUnsettledConflict"
INVARIANTS
    NoSelfConflict
