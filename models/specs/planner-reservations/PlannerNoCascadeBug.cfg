\* SPEC: PlannerReservations.tla
\* Mutates: a transaction that can never land is written off, but the
\* transactions built on it are left alone.
\* Should violate: NoLeak. The descendant can never land either, and holds
\* its reservations for ever.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "NoCascade"
INVARIANTS
    NoLeak
