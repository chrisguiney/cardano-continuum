\* SPEC: PlannerReservations.tla
\* Mutates: after a drop notice, a second attempt may spend any outputs on
\* offer; it need not conflict with the first.
\* Should violate: IntentAtMostOnce. The notice was a block in flight: the
\* first attempt is on the chain, the second lands beside it, and the intent
\* is paid twice.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "FreshInputs"
INVARIANTS
    IntentAtMostOnce
