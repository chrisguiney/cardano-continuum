\* SPEC: PlannerReservations.tla
\* Mutates: as PlannerSettleAtTipBug, a transaction counts as finished when
\* the view first holds it, not when it is K deep.
\* Should violate: SettledIsFinal. The planner calls settled a transaction
\* in a block the node can still roll back.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "SettleAtTip"
INVARIANTS
    SettledIsFinal
