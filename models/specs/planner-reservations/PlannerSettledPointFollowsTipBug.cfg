\* SPEC: PlannerReservations.tla
\* Mutates: the settled point is always K behind the view's tip, so a
\* rollback moves it back.
\* Should violate: NoSelfConflict. A restart resumes the view from before a
\* transaction that had settled and released its inputs; another intent is
\* handed them.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 0
    MaxRestarts = 1
    RebuildNeedsDrop = TRUE
    Mutation = "SettledPointFollowsTip"
INVARIANTS
    NoSelfConflict
