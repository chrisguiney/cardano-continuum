\* SPEC: PlannerReservations.tla
\* The unmutated rule with four transactions of one input each, so both
\* intents can be attempted twice. No failed submission, to keep the run
\* short.
\* Expected: every invariant holds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 4
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 1
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 0
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    SettledViewIsChain
    ReservedWhileUnfinished
    NoLeak
    InputsTracked
    DeadIsDead
    SettledIsFinal
    NoSelfConflict
    IntentAtMostOnce
