\* SPEC: PlannerReservations.tla
\* The unmutated rule with RebuildNeedsDrop = FALSE: a second attempt may be
\* built at any time, with no drop notice. Shows that safety rests on the
\* conflict rule alone and a drop notice is only a trigger. Mempool evictions
\* are switched off because nothing reads them here.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 0
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = FALSE
    Mutation = "none"
INVARIANTS
    TypeOK
    SettledViewIsChain
    ReservedWhileUnfinished
    NoLeak
    InputsTracked
    DeadIsDead
    SettledIsFinal
    NoSelfConflict
    IntentAtMostOnce
