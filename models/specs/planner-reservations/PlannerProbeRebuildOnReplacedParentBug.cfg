\* SPEC: PlannerReservations.tla
\* Probe, no mutation: two unfinished attempts of one intent that share no
\* input and exclude each other only through the transactions they build on.
\* Four transactions of one input each.
\* Should violate: ProbeNoRebuildOnReplacedParent (the model can reach the
\* state the probe denies).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 4
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 1
    MaxRollbacks = 1
    MaxAdv = 0
    MaxDrops = 1
    MaxFails = 0
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "none"
INVARIANTS
    ProbeNoRebuildOnReplacedParent
