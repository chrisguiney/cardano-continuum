\* SPEC: PlannerReservations.tla
\* Mutates: a transaction with several inputs reserves only the first.
\* Should violate: ReservedWhileUnfinished. Its other input is free for
\* another intent while it is unfinished.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "PartialReserve"
INVARIANTS
    ReservedWhileUnfinished
