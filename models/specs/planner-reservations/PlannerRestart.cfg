\* SPEC: PlannerReservations.tla
\* The unmutated rule with one engine restart at any point. Failed
\* submissions are switched off to keep the run short; PlannerPersistLateBug
\* and the other restart configs use the same bounds.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 0
    MaxRestarts = 1
    RebuildNeedsDrop = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    SettledViewIsChain
    ReservedWhileUnfinished
    NoLeak
    InputsTracked
    DeadIsDead
    SettledIsFinal
    NoSelfConflict
    IntentAtMostOnce
