\* SPEC: PlannerReservations.tla
\* Mutates: a transaction is written off when the view's tip passes its time-
\* to-live, not when the settled tip does.
\* Should violate: NoSelfConflict. A rollback brings the tip back inside the
\* time-to-live, so the transaction can be included after its inputs went to
\* another intent. The time-to-live is one block here so that one outside
\* block passes it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 1
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "ExpireAtTip"
INVARIANTS
    NoSelfConflict
