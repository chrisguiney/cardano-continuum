\* SPEC: PlannerReservations.tla
\* Mutates: any submission error releases the inputs, including one where the
\* transaction did reach a node (a timeout, a broken connection).
\* Should violate: NoSelfConflict. The transaction is in the network and
\* another intent is handed its inputs.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "ReleaseOnSubmitError"
INVARIANTS
    NoSelfConflict
