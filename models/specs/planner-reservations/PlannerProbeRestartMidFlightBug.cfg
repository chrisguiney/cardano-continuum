\* SPEC: PlannerReservations.tla
\* Probe, no mutation: a restart while a chained transaction is on the chain
\* and not yet in the resumed view.
\* Should violate: ProbeNoRestartMidFlight (the model can reach the state the
\* probe denies).
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 0
    MaxRestarts = 1
    RebuildNeedsDrop = TRUE
    Mutation = "none"
INVARIANTS
    ProbeNoRestartMidFlight
