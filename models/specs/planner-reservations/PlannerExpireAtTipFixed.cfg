\* SPEC: PlannerReservations.tla
\* PlannerExpireAtTipBug's bounds (a time-to-live of one block) with the
\* rule as the code has it: a transaction is written off only when the
\* settled tip passes its time-to-live.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 1
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    SettledViewIsChain
    ReservedWhileUnfinished
    NoLeak
    InputsTracked
    DeadIsDead
    SettledIsFinal
    NoSelfConflict
    IntentAtMostOnce
