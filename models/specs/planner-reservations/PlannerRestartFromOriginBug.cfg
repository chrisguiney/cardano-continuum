\* SPEC: PlannerReservations.tla
\* Mutates: after a restart the view is rebuilt from the first block, while
\* the store keeps what it released.
\* Should violate: NoSelfConflict. A settled transaction released its inputs;
\* in the empty view they look unspent, and another intent is handed them.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 0
    MaxRestarts = 1
    RebuildNeedsDrop = TRUE
    Mutation = "RestartFromOrigin"
INVARIANTS
    NoSelfConflict
