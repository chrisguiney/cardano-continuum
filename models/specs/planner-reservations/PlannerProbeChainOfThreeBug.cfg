\* SPEC: PlannerReservations.tla
\* Probe, no mutation: three unconfirmed transactions chained one on the
\* next. Three intents, because a transaction built on an attempt of its own
\* intent would land together with it.
\* Should violate: ProbeNoChainOfThree (the model can reach the state the
\* probe denies).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 3
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "none"
INVARIANTS
    ProbeNoChainOfThree
