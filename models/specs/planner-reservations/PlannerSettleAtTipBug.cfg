\* SPEC: PlannerReservations.tla
\* Mutates: a transaction counts as finished when the view first holds it,
\* not when it is K deep.
\* Should violate: InputsTracked. The block is rolled back: a transaction
\* built on its change now spends an output the view no longer has and the
\* planner no longer tracks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "SettleAtTip"
INVARIANTS
    InputsTracked
