\* SPEC: PlannerReservations.tla
\* Mutates: the settled point is K - 1 blocks behind the view's tip, not K.
\* Should violate: SettledViewIsChain. What the planner calls settled
\* reaches into the part of the chain a rollback can still undo.
SPECIFICATION Spec
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "SettleOneShallow"
INVARIANTS
    SettledViewIsChain
