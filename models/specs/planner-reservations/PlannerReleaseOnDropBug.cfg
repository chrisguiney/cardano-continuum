\* SPEC: PlannerReservations.tla
\* Mutates: a drop notice ends the attempt: it and everything built on it are
\* written off and their inputs released, before anything is K deep.
\* Should violate: NoSelfConflict. Another intent is handed the released
\* input while the first transaction can still be included: the planner races
\* itself.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "ReleaseOnDrop"
INVARIANTS
    NoSelfConflict
