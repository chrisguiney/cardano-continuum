\* SPEC: PlannerReservations.tla
\* Mutates: a new attempt must conflict with the newest unfinished attempt of
\* its intent only, not with every one.
\* Should violate: IntentAtMostOnce. The third attempt conflicts with the
\* second and not with the first, and lands together with the first.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NumGenesis = 2
    MaxTx = 3
    NumIntents = 2
    K = 1
    TtlDelta = 2
    MaxChain = 3
    MaxIns = 2
    MaxRollbacks = 1
    MaxAdv = 1
    MaxDrops = 1
    MaxFails = 1
    MaxRestarts = 0
    RebuildNeedsDrop = TRUE
    Mutation = "ConflictWithLatestOnly"
INVARIANTS
    IntentAtMostOnce
