\* SPEC: PoolForging.tla
\* Mutation: a deposed leader never refreshes and keeps applying the older
\* spec generation it holds after the new leader applied the newer one. Safety
\* survives (the passing Overlap config), but the pool flaps. Expected:
\* LiveForges is violated.
SPECIFICATION LiveSpec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1", "r2"}
    Deposed = {"r2"}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 1
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "StaleLeader"
PROPERTIES
    LiveForges
