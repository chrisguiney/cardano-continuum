\* SPEC: PoolForging.tla
\* The design with fair engine, operator, kubelet and node-resolution steps: a
\* pool planned live ends up forging for good, a pool planned dark or retired
\* ends up with nothing holding its keys. Expected: LiveForges and DarkStops
\* hold.
SPECIFICATION LiveSpec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 1
    MaxDig = 1
    MaxReq = 2
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 1
    MaxLosses = 1
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "none"
PROPERTIES
    LiveForges
    DarkStops
