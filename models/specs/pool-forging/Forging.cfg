\* SPEC: PoolForging.tla
\* The design with one reconciler on a healthy cluster: three lifecycle
\* requests (go live, go dark, switch implementation, retire), two KES
\* rotations and an engine crash mid-issue. Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 2
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 1
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "none"
INVARIANTS
    TypeOK
    AtMostOneForger
    DuplicateScoped
    ForgedBlocksValid
    CounterNeverReused
    KesValidForSlot
    SwitchCarriesCounter
    NoDarkByHarness
    NoForgeAfterRetire
