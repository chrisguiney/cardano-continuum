\* SPEC: PoolForging.tla
\* Probe: a stale reconciler creates a pod object for a pool after its
\* retirement took effect (it can never start). Expected: ProbeNoLatePod is
\* violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1", "r2"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "none"
INVARIANTS
    ProbeNoLatePod
