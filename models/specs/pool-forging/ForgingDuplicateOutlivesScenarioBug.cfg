\* SPEC: PoolForging.tla
\* Mutation: the scenario is declared over when the duplicate ContinuumPool is
\* deleted, without waiting for its pod. Expected: DuplicateScoped is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 1
    MaxScen = 1
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "DuplicateOutlives"
INVARIANTS
    DuplicateScoped
