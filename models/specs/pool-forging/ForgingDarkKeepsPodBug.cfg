\* SPEC: PoolForging.tla
\* Mutation: the operator deletes a keyed pod only for a wrong implementation
\* or image, never for the pool going dark, so a pool planned dark keeps
\* forging. Expected: DarkStops is violated.
\* No deadlock check: a dark pool left forging has no step left, and the
\* defect is that it never stops, which DarkStops reports.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 2
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "DarkKeepsPod"
PROPERTIES
    DarkStops
