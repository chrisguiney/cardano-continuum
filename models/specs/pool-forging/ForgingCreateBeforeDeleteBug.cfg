\* SPEC: PoolForging.tla
\* Mutation: per-driver names and an in-place implementation switch. One
\* reconciler, no faults: it creates the new driver's pod as soon as the spec
\* names it, while the old driver's pod still runs. Expected: AtMostOneForger
\* is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = TRUE
    Mutation = "FencePerDriver"
INVARIANTS
    AtMostOneForger
