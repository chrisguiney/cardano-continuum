\* SPEC: PoolForging.tla
\* Mutation: the engine reads the pod list as empty and then replaces the
\* opcert, without blanking the Secret first. A stale reconciler creates a pod
\* between the read and the write; it starts with the old, never-forged
\* opcert, and both opcerts end up on chain with one counter. Expected:
\* CounterNeverReused is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1", "r2"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 1
    MaxDig = 0
    MaxReq = 1
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "IssueWithoutBlank"
INVARIANTS
    CounterNeverReused
