\* SPEC: PoolForging.tla
\* Mutation: the operator removes the finalizer of a terminating pod whose
\* node has stopped answering (NotReady treated as dead). Expected:
\* AtMostOneForger is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 1
    MaxReq = 2
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 1
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "LostIsGone"
INVARIANTS
    AtMostOneForger
