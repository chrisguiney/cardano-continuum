\* SPEC: PoolForging.tla
\* Two pools sharing the clock and the bounds: one pool's fence and counters
\* do not depend on the other's. Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1", "p2"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 1
    MaxDig = 0
    MaxReq = 2
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 1
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "none"
INVARIANTS
    TypeOK
    AtMostOneForger
    DuplicateScoped
    ForgedBlocksValid
    CounterNeverReused
    KesValidForSlot
    SwitchCarriesCounter
    NoDarkByHarness
    NoForgeAfterRetire
