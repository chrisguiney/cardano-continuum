\* SPEC: PoolForging.tla
\* Mutation: keyed pods carry no finalizer, so the fence is 'the pod object is
\* gone'. A node is lost and its pod is force-deleted: the name is free while
\* the process still forges. Expected: AtMostOneForger is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 1
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 1
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "NoFinalizer"
INVARIANTS
    AtMostOneForger
