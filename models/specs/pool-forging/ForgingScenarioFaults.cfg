\* SPEC: PoolForging.tla
\* A scenario window on a faulty cluster: an image roll, a pod death and a
\* lost node hit either pod of the pair. Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 1
    MaxReq = 1
    MaxScen = 1
    MaxCrashes = 0
    MaxDeaths = 1
    MaxLosses = 1
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "none"
INVARIANTS
    TypeOK
    AtMostOneForger
    DuplicateScoped
    ForgedBlocksValid
    CounterNeverReused
    KesValidForSlot
    SwitchCarriesCounter
    NoDarkByHarness
    NoForgeAfterRetire
