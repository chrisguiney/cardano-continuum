\* SPEC: PoolForging.tla
\* Mutation: the opcert's KES start period is fixed at genesis (0) instead of
\* the chain's current period. Once the chain is past period 0 every opcert
\* the engine issues is already due for rotation, so the pool is taken dark
\* and never written live again. Expected: LiveForges is violated (the pool is
\* dark by the harness's doing).
SPECIFICATION LiveSpec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 1
    MaxDig = 0
    MaxReq = 1
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "KesFromGenesis"
PROPERTIES
    LiveForges
