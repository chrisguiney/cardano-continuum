\* SPEC: PoolForging.tla
\* Mutation: the engine starts a rotation only once the KES key has expired,
\* with no margin. Expected: NoDarkByHarness is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 2
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "RotateAtExpiry"
INVARIANTS
    NoDarkByHarness
