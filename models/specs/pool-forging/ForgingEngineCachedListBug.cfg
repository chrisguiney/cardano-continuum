\* SPEC: PoolForging.tla
\* Mutation: the engine reads 'no pods' from an informer cache instead of the
\* API server. The cache has not yet seen the pod. Expected:
\* NoForgeAfterRetire is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "EngineCachedList"
INVARIANTS
    NoForgeAfterRetire
