\* SPEC: PoolForging.tla
\* The design with one reconciler on a faulty cluster: an image roll, a pod
\* death and a lost node, alongside two lifecycle requests and a KES rotation.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 1
    MaxDig = 1
    MaxReq = 2
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 1
    MaxLosses = 1
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "none"
INVARIANTS
    TypeOK
    AtMostOneForger
    DuplicateScoped
    ForgedBlocksValid
    CounterNeverReused
    KesValidForSlot
    SwitchCarriesCounter
    NoDarkByHarness
    NoForgeAfterRetire
