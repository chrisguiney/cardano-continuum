\* SPEC: PoolForging.tla
\* Mutation: the engine reads the pool's counter from a view of the chain that
\* lags (for example its K-deep view) instead of every block seen. The view
\* misses the pool's last block, so the new opcert takes a counter that is
\* already on chain. Expected: CounterNeverReused is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 2
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "StaleCounter"
INVARIANTS
    CounterNeverReused
