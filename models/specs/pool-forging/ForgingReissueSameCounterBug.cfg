\* SPEC: PoolForging.tla
\* Mutation: the counter comes from the engine's own record, and the engine
\* died after writing the Secret but before recording the issue. After the
\* restart its next issue uses the same counter for a different opcert.
\* Expected: CounterNeverReused is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 2
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 1
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "BookCounter"
INVARIANTS
    CounterNeverReused
