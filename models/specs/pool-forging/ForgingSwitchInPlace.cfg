\* SPEC: PoolForging.tla
\* Design option: the engine changes the implementation with one write to a
\* live spec and keeps the opcert; the operator alone serialises the switch.
\* Expected: every invariant holds, so the dark spell on a switch is not
\* needed for safety.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 2
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 1
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = TRUE
    Mutation = "none"
INVARIANTS
    TypeOK
    AtMostOneForger
    DuplicateScoped
    ForgedBlocksValid
    CounterNeverReused
    KesValidForSlot
    SwitchCarriesCounter
    NoDarkByHarness
    NoForgeAfterRetire
