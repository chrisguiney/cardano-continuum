\* SPEC: PoolForging.tla
\* Mutation: an image roll is a new StatefulSet (the pod name includes the
\* digest) and the old pod is deleted once the new one runs. Expected:
\* AtMostOneForger is violated by two pods of the same implementation on
\* different digests.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 1
    MaxReq = 1
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "RollSurge"
INVARIANTS
    AtMostOneForger
