\* SPEC: PoolForging.tla
\* Mutation: the engine lets the retirement take effect as soon as the spec
\* says dark, while the pod is still terminating. Expected: NoForgeAfterRetire
\* is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "RetireBeforeGone"
INVARIANTS
    NoForgeAfterRetire
