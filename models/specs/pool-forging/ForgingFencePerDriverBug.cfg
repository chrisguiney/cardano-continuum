\* SPEC: PoolForging.tla
\* Mutation: the pod name includes the implementation (one StatefulSet per
\* driver), so the API server only excludes pods of the same driver. During a
\* leader handover a reconciler with an older snapshot recreates the dingo pod
\* while the other creates the cardano-node pod. Expected: AtMostOneForger is
\* violated on a dingo + cardano-node pair.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1", "r2"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "FencePerDriver"
INVARIANTS
    AtMostOneForger
