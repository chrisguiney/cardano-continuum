\* SPEC: PoolForging.tla
\* Mutation: the engine takes the next counter from its own record of the last
\* one it issued, not from the chain (as ForgingDoubleIssueBug). The jump is
\* in the Secret before any block is forged with it. Expected:
\* SwitchCarriesCounter is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 2
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "BookCounter"
INVARIANTS
    SwitchCarriesCounter
