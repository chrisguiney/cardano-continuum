\* SPEC: PoolForging.tla
\* Mutation: per-driver names, and the operator fences by checking its own
\* snapshot for a keyed pod before it creates one (Fence(existing, next) over
\* cached pods). The check and the create are two steps, so another
\* reconciler's create lands between them. Expected: AtMostOneForger is
\* violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1", "r2"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "CacheFence"
INVARIANTS
    AtMostOneForger
