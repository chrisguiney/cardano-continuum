\* SPEC: PoolForging.tla
\* The design with two reconcilers acting at once (a leader handover that
\* never ends), each on its own snapshot, plus a lost node. Expected: every
\* invariant holds.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1", "r2"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 1
    MaxDig = 0
    MaxReq = 3
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 1
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "none"
INVARIANTS
    TypeOK
    AtMostOneForger
    DuplicateScoped
    ForgedBlocksValid
    CounterNeverReused
    KesValidForSlot
    SwitchCarriesCounter
    NoDarkByHarness
    NoForgeAfterRetire
