\* SPEC: PoolForging.tla
\* Mutation: the duplicate mounts the pool's own keys Secret, so nothing stops
\* it starting outside the scenario. A reconciler whose snapshot still shows
\* the scenario recreates it after the scenario closed. Expected:
\* DuplicateScoped is violated.
SPECIFICATION Spec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1", "r2"}
    Deposed = {}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 1
    MaxScen = 1
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "DuplicateSharedSecret"
INVARIANTS
    DuplicateScoped
