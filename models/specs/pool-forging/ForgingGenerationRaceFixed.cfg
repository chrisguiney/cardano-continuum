\* SPEC: PoolForging.tla
\* ForgingGenerationRaceBug's bounds with the rule as the code has it.
\* Pools.newest skips a spec older than the newest generation seen, so no
\* reconciler keeps acting on the older one: in the model the deposed
\* reconciler refreshes like the other (Deposed has an effect only under
\* StaleLeader). Expected: LiveForges holds.
SPECIFICATION LiveSpec
CONSTANTS
    Pools = {"p1"}
    Impls = {"dingo", "cardano-node"}
    Reconcilers = {"r1", "r2"}
    Deposed = {"r2"}
    MaxEvo = 2
    MaxPeriod = 0
    MaxDig = 0
    MaxReq = 1
    MaxScen = 0
    MaxCrashes = 0
    MaxDeaths = 0
    MaxLosses = 0
    CPraos = TRUE
    SwitchInPlace = FALSE
    Mutation = "none"
PROPERTIES
    LiveForges
