\* SPEC: ParamChange.tla
\* Mutates: the engine judges a change enacted from its votes weighed with
\* the voting power of now, not the boundary's (the paramPassed defect).
\* Voting power moves after the boundary the ledger tallied at. Should
\* violate: RootAgrees.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1, 2}
    MaxEpoch = 4
    Life = 1
    MaxProps = 3
    MaxMoves = 1
    Mutation = "TallyNow"
INVARIANTS
    RootAgrees
