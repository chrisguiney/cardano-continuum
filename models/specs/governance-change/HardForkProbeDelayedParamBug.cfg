\* SPEC: HardFork.tla
\* Probe, no mutation: a parameter change that would pass is delayed by
\* a hard fork ratified at the same boundary. Should violate:
\* ProbeNoDelayedParam.
SPECIFICATION Spec
CONSTANTS
    Start = 10
    MaxEpoch = 4
    Life = 1
    MaxForks = 1
    MaxParams = 1
    Mutation = "none"
INVARIANTS
    ProbeNoDelayedParam
