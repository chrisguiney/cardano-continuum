\* and the view still offers it for votes until its last epoch. Should
\* violate: VotesFindAction (GovActionsDoNotExist).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 4
    Life = 1
    MaxProps = 3
    MaxMoves = 0
    Ledger = "real"
    Mutation = "none"
INVARIANTS
    VotesFindAction
