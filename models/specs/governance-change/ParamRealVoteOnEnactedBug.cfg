\* SPEC: ParamChange.tla
\* Mutates: the view keeps an enacted change open until its last voting
\* epoch, so voters still vote on it after the ledger removed it. A
\* lifetime of two epochs leaves one after the removal (with one, the
\* removal and the last voting epoch's end coincide). Should violate:
\* VotesFindAction (GovActionsDoNotExist).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 5
    Life = 2
    MaxProps = 3
    MaxMoves = 0
    Mutation = "VoteOnEnacted"
INVARIANTS
    VotesFindAction
