\* SPEC: ParamChange.tla
\* Mutates: the proposer builds a change while its last one is still in
\* flight. Should violate: OneOpen. Both name the same predecessor; the
\* view's ratification still follows the ledger's root, so RootAgrees
\* holds, but the loser is a sibling cardano-node drops on enactment.
SPECIFICATION Spec
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 4
    Life = 1
    MaxProps = 2
    MaxMoves = 0
    Mutation = "NoFlightGuard"
INVARIANTS
    OneOpen
