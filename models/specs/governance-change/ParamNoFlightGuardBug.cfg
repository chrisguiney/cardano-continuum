\* SPEC: ParamChange.tla
\* Mutates: the proposer builds a change while its last one is still in
\* flight. Should violate: RootAgrees. Both name the same predecessor and
\* pass; the ledger enacts the first and the engine believes the second.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 4
    Life = 1
    MaxProps = 2
    MaxMoves = 0
    Ledger = "fake"
    Mutation = "NoFlightGuard"
INVARIANTS
    RootAgrees
