\* SPEC: ParamChange.tla
\* The proposer's rules against the ledger: three voters of equal
\* power, a lifetime of one epoch, three changes over four epochs.
\* Expected: every invariant holds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 4
    Life = 1
    MaxProps = 3
    MaxMoves = 0
    Mutation = "none"
INVARIANTS
    TypeOK
    OneOpen
    RootAgrees
    PrevAccepted
    VotesInTime
    VotesFindAction
