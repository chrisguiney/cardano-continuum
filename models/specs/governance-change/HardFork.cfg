\* SPEC: HardFork.tla
\* The engine's hard-fork rules against the ledger: two hard forks and
\* two parameter changes over six epochs, a lifetime of one epoch.
\* Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Start = 10
    MaxEpoch = 6
    Life = 1
    MaxForks = 2
    MaxParams = 2
    Mutation = "none"
INVARIANTS
    TypeOK
    VersionAgrees
    ForkRootAgrees
    ParamRootAgrees
    ForkAccepted
    ParamAccepted
    OneFork
