\* SPEC: ParamChange.tla
\* Mutation NoExpire: the ledger never expires a change, so one the voters
\* leave unpassed stays live for good. At ParamLive's bounds.
\* Expected: Settles is violated.
SPECIFICATION LiveSpec
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 3
    Life = 1
    MaxProps = 2
    MaxMoves = 0
    Mutation = "NoExpire"
PROPERTIES
    Settles
