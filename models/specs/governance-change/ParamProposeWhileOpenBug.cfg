\* SPEC: ParamChange.tla
\* Mutates: the proposer builds a change while one is open in the view.
\* Should violate: PrevAccepted. Its next change names the one the ledger
\* never enacted.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 4
    Life = 1
    MaxProps = 3
    MaxMoves = 0
    Mutation = "ProposeWhileOpen"
INVARIANTS
    PrevAccepted
