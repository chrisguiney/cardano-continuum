\* SPEC: ParamChange.tla
\* As Param, with a lifetime of two epochs over five, so a change can be
\* enacted while two epochs of its life remain. Expected: all hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 5
    Life = 2
    MaxProps = 3
    MaxMoves = 0
    Mutation = "none"
INVARIANTS
    TypeOK
    OneOpen
    RootAgrees
    PrevAccepted
    VotesInTime
    VotesFindAction
