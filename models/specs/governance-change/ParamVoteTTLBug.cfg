\* SPEC: ParamChange.tla
\* Mutates: a vote in its change's last epoch keeps the usual TTL, which
\* can run past the boundary. Should violate: VotesInTime (the ledger
\* refuses it with VotingOnExpiredGovAction).
SPECIFICATION Spec
SYMMETRY VoterSym
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 4
    Life = 1
    MaxProps = 3
    MaxMoves = 0
    Mutation = "LateVoteTTL"
INVARIANTS
    VotesInTime
