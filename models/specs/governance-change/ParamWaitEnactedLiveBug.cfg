\* SPEC: ParamChange.tla
\* Mutation WaitEnacted: the proposer also waits for every earlier change
\* to be enacted, so a change that expires stops the chain of changes.
\* At ParamLive's bounds.
\* Expected: ProposerMoves is violated.
SPECIFICATION LiveSpec
CONSTANTS
    Voters = {v1, v2, v3}
    Weights = {1}
    MaxEpoch = 3
    Life = 1
    MaxProps = 2
    MaxMoves = 0
    Mutation = "WaitEnacted"
PROPERTIES
    ProposerMoves
