    Floor = 70
    MaxEpoch = 4
    RetireMax = 2
    MaxFaults = 2
    FaultMargin = 0
    Recovery = TRUE
    Repairable = TRUE
    DarkFirst = TRUE
    BlocksBelowFloor = TRUE
    RecoverEpochs = 1
    MaxMoves = 0
    MaxDarks = 1
    Mutation = "PlanIsForging"
INVARIANTS
    RecoverBound
