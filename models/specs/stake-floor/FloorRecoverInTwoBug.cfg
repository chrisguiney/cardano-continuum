\* SPEC: StakeFloor.tla
\* FloorRecover's setting, claiming the floor is back within 2 epochs.
\* Should violate: RecoverBound. When no block can land in the epoch of
\* the death (the only stake left is on a pool whose retirement is in
\* flight), the redelegation lands one epoch late.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Floor = 70
    MaxEpoch = 4
    RetireMax = 2
    MaxFaults = 2
    FaultMargin = 0
    Recovery = TRUE
    Repairable = FALSE
    DarkFirst = TRUE
    BlocksBelowFloor = TRUE
    RecoverEpochs = 2
    MaxMoves = 0
    MaxDarks = 1
    Mutation = "none"
INVARIANTS
    RecoverBound
