\* SPEC: StakeFloor.tla
\* Mutates: recovery starts only once the schedule in use is below the
\* floor, in FloorRecoverRepair's setting.
\* Should violate: RecoverBound. A pod that dies after the epoch's last
\* block leaves this epoch above the floor and the next one below it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Floor = 70
    MaxEpoch = 4
    RetireMax = 2
    MaxFaults = 2
    FaultMargin = 0
    Recovery = TRUE
    Repairable = TRUE
    DarkFirst = TRUE
    BlocksBelowFloor = TRUE
    RecoverEpochs = 1
    MaxMoves = 0
    MaxDarks = 1
    Mutation = "RecoverOnBreach"
INVARIANTS
    RecoverBound
