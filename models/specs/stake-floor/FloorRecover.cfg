\* SPEC: StakeFloor.tla
\* Two pod deaths beyond the margin, not repairable; any forging stake
\* gives a block per epoch. The engine brings pools live and redelegates.
\* Expected: the floor is back within 3 epochs of the last pod death
\* unless the ledger froze.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Floor = 70
    MaxEpoch = 4
    RetireMax = 2
    MaxFaults = 2
    FaultMargin = 0
    Recovery = TRUE
    Repairable = FALSE
    DarkFirst = TRUE
    BlocksBelowFloor = TRUE
    RecoverEpochs = 3
    MaxMoves = 0
    MaxDarks = 1
    Mutation = "none"
INVARIANTS
    TypeOK
    RecoverBound
    RetiredOnlyAtBoundary
