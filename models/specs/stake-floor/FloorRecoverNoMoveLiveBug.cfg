\* SPEC: StakeFloor.tla
\* Mutation NoMove: the recovery brings pools live but never moves stake off
\* a dead pool, in FloorRecoverLive's setting. Expected: RecoveryFinishes is
\* violated.
\* The deadlock check is off: the epoch that can never end is the stuck
\* state this config exists to show, and RecoveryFinishes reports it.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Floor = 70
    MaxEpoch = 4
    RetireMax = 2
    MaxFaults = 2
    FaultMargin = 0
    Recovery = TRUE
    Repairable = FALSE
    DarkFirst = TRUE
    BlocksBelowFloor = TRUE
    RecoverEpochs = 3
    MaxMoves = 0
    MaxDarks = 1
    Mutation = "NoMove"
PROPERTIES
    RecoveryFinishes
