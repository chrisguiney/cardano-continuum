---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: continuumpools.continuum.blinklabs.io
spec:
  group: continuum.blinklabs.io
  names:
    kind: ContinuumPool
    listKind: ContinuumPoolList
    plural: continuumpools
    singular: continuumpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.impl
      name: Impl
      type: string
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.tip.slot
      name: Tip Slot
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ContinuumPool is one simulated stake pool on a ContinuumNetwork.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ContinuumPoolSpec describes one simulated stake pool.
            properties:
              analytics:
                description: |-
                  Analytics adds the mithril2pq sidecar, which writes the node's
                  ImmutableDB to the run's Parquet volume. Only implementations with an
                  ImmutableDB support it.
                type: boolean
              dark:
                description: |-
                  Dark scales the workload to zero. The pool stays registered and misses
                  blocks.
                type: boolean
              image:
                description: Image overrides the network's default image for this
                  implementation.
                type: string
              impl:
                description: Implementation selects the node implementation.
                enum:
                - dingo
                - cardano-node
                - amaru
                - rogue
                type: string
              keysSecret:
                description: |-
                  KeysSecret names the Secret holding kes.skey, vrf.skey and
                  opcert.cert. The engine writes it. Only forging-tier pools mount it.
                type: string
              networkRef:
                description: NetworkRef names the ContinuumNetwork this pool joins.
                minLength: 1
                type: string
              poolId:
                description: |-
                  PoolID is the pool's identifier. The fence admits at most one forging
                  pool per PoolID, across every implementation.
                minLength: 1
                type: string
              tier:
                description: Tier selects what the pool renders.
                enum:
                - logical
                - validating
                - forging
                type: string
              unsafeDuplicateOf:
                description: |-
                  UnsafeDuplicateOf names another pool whose PoolID this pool forges
                  with on purpose. It is admitted only while the network carries the
                  scenario annotation and this pool is labelled with that scenario id.
                  The pool is deleted when the scenario ends. It permits two forgers for
                  one PoolID, which is equivocation. Use it only in scenarios that test
                  the fence or a fork.
                type: string
            required:
            - impl
            - networkRef
            - poolId
            - tier
            type: object
          status:
            description: ContinuumPoolStatus is the observed state of a ContinuumPool.
            properties:
              build:
                description: Build is the build provenance of the running image.
                properties:
                  dirty:
                    description: |-
                      Dirty is true when the build included uncommitted source. A finding
                      from a dirty build is not reproducible from its commit.
                    type: boolean
                  mode:
                    description: Mode is how the build was produced.
                    enum:
                    - upstream
                    - fast
                    - repro
                    type: string
                  revisions:
                    additionalProperties:
                      type: string
                    description: |-
                      Revisions maps each dependency group (for example dingo, gouroboros,
                      plutigo, ouroboros-mock) to the revision it was built from.
                    type: object
                type: object
              conditions:
                description: Conditions report admission, fencing and budget decisions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              image:
                description: Image is the image the workload runs, pinned to its digest.
                properties:
                  build:
                    description: Build describes how the image was produced.
                    properties:
                      dirty:
                        description: |-
                          Dirty is true when the build included uncommitted source. A finding
                          from a dirty build is not reproducible from its commit.
                        type: boolean
                      mode:
                        description: Mode is how the build was produced.
                        enum:
                        - upstream
                        - fast
                        - repro
                        type: string
                      revisions:
                        additionalProperties:
                          type: string
                        description: |-
                          Revisions maps each dependency group (for example dingo, gouroboros,
                          plutigo, ouroboros-mock) to the revision it was built from.
                        type: object
                    type: object
                  commit:
                    description: |-
                      Commit is the source commit, from the OCI revision label or the image
                      ENV COMMIT_HASH. Empty for third-party images that carry neither.
                    type: string
                  digest:
                    description: |-
                      Digest is the manifest digest the reference resolved to. Pods run
                      image@digest, so a moved tag rolls only pods whose digest changed.
                    type: string
                  ref:
                    description: Ref is the reference as configured.
                    type: string
                type: object
              phase:
                description: Phase is the observed lifecycle phase.
                enum:
                - Pending
                - Syncing
                - Forging
                - Dark
                type: string
              tip:
                description: Tip is the pool node's last observed chain tip.
                properties:
                  hash:
                    description: Hash is the tip block hash, hex encoded.
                    type: string
                  slot:
                    description: Slot is the tip slot.
                    format: int64
                    type: integer
                type: object
              workload:
                description: Workload names the StatefulSet the operator rendered
                  for this pool.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
