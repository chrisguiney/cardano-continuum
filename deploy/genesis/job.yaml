# Renders the devnet genesis into the continuum-genesis volume. The seed comes
# from the continuum-seed Secret (key "seed", 64 hex characters). Rerunning
# the Job against the same volume and spec is a no-op, so systemStart is kept.
# The image is built by `make ko-images` and pushed to CONTINUUM_REGISTRY.
# Pool host names are fully qualified with the Job's namespace: cardano-node
# resolves topology hosts with its own DNS client, which ignores the pod's
# search domains, so a bare "pool-0" never resolves and the pools never
# connect. Kubernetes expands $(POD_NAMESPACE) in args from the env below.
apiVersion: batch/v1
kind: Job
metadata:
  name: continuum-genesis
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: genesis
          image: continuum-genesis
          args:
            - -out=/genesis
            - -pool-host=pool-%d.$(POD_NAMESPACE).svc.cluster.local
            - -start-delay=60s
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONTINUUM_SEED
              valueFrom:
                secretKeyRef:
                  name: continuum-seed
                  key: seed
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: genesis
              mountPath: /genesis
      volumes:
        - name: genesis
          persistentVolumeClaim:
            claimName: continuum-genesis
