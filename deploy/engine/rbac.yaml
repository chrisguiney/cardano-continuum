# Lets the engine patch its network's ContinuumPools (the pool plan) and read
# their status (pod health).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: continuum-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: continuum-engine
rules:
  - apiGroups: [continuum.blinklabs.io]
    resources: [continuumpools]
    verbs: [get, list, watch, patch]
  - apiGroups: [continuum.blinklabs.io]
    resources: [continuumnetworks]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: continuum-engine
subjects:
  - kind: ServiceAccount
    name: continuum-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: continuum-engine
