<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the style before first paint so there is no flash. The key and
      // values match src/lib/appearance.ts. The UI is dark only.
      (function () {
        var d = document.documentElement, st = "continuum";
        try {
          if (localStorage.getItem("style") === "shadcn") st = "shadcn";
        } catch (e) {}
        d.dataset.style = st;
        d.dataset.theme = "dark";
      })();
    </script>
    <title>continuum</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
