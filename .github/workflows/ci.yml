name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  # make check is check-static plus test-race; CI runs the two halves, and
  # the tests in shards, as parallel jobs so each fits a 4-vCPU runner.
  static:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-static-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-static-

      - name: Read the golangci-lint version
        id: lint
        run: echo "version=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint.outputs.version }}
          install-only: true

      - name: make check-static
        run: make check-static

      # Saved whatever the outcome: a cache saved only on success is never
      # written while the job keeps failing, and every run starts cold.
      - name: Save Go caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-static-${{ hashFiles('go.mod', 'go.sum') }}

  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [engine-a, engine-b, engine-internal, cli, rest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-test-${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-test-${{ matrix.shard }}-

      - name: make test-race
        run: make test-race SHARD=${{ matrix.shard }}

      - name: Save Go caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-test-${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum') }}

  # The web UI's typecheck and Vitest unit tests need Node, so they run in
  # their own job. make check stays free of Node: web/dist is committed.
  web-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: make web-test
        run: make web-test

  # The kind e2e suite takes about half an hour, so it runs nightly and on
  # demand instead of on every push. Docker is preinstalled on the runner;
  # kind and ko run through `go run` at the versions pinned in the Makefile.
  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: make e2e
        run: make e2e

      - name: make kind-down
        if: always()
        run: make kind-down
