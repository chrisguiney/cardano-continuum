version: 1
profiles:
  - name: yield-farmer
    kind: wallet
    agenda: yield
    traits:
      competence: beta(5, 3)
      patience: pareto(xm=50, alpha=1.3)
      learning_rate: exp(10)
      care: beta(4, 2)
    budget: 5000000000
    rates:
      base:
        send: 0.2
        delegate: 0.05
      diurnal: 0.4
      hawkes:
        alpha: 0.3
        beta: 1.5
    weights:
      send: 0.75
      delegate: 0.25
    hazards:
      birth: 0.01
      dormancy: lognormal(2, 0.8)
      abandon: 0.001
  - name: griefer
    kind: wallet
    agenda: disrupt
    traits:
      competence: beta(9, 1)
      patience: const(100)
      learning_rate: const(0)
      care: const(0)
    budget: 100000000
    adversary:
      attacks: [dust-flood, utxo-contention]
      cost_ceiling: 50000000
      success_metric: mempool-occupancy
