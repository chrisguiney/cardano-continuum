version: 1
profiles:
  # A casual holder: acts about once every ten seconds, mostly decides to
  # wait, and now and then pays another wallet.
  - name: holder
    kind: wallet
    agenda: hodl
    traits:
      competence: beta(8, 2)
      patience: lognormal(1.0, 0.5)
      learning_rate: const(0.05)
      care: beta(2, 2)
    budget: 1000000000
    rates:
      base:
        send: 0.1
      diurnal: 0.3
    weights:
      send: 1
    hazards:
      birth: 0.005
      dormancy: lognormal(5, 1)
      abandon: 0.00002
      # Dormancy onset and abandonment follow the market (markets.deaths).
      market: true
  # A busier spender with a smaller budget.
  - name: spender
    kind: wallet
    agenda: hodl
    traits:
      competence: beta(5, 3)
      patience: const(10)
      learning_rate: const(0.05)
      care: beta(2, 2)
    budget: 200000000
    rates:
      base:
        send: 0.5
      diurnal: 0.3
    weights:
      send: 1
    hazards:
      birth: 0.002
      dormancy: lognormal(4, 0.8)
      abandon: 0.0001
      market: true
  # A market trader: buys ADA on rallies and takes profit, and in a
  # drawdown sells or holds by its loss aversion and patience, where the
  # hodl profiles above always hold.
  - name: trader
    kind: wallet
    agenda: profit
    traits:
      competence: beta(8, 2)
      patience: lognormal(0.5, 0.8)
      learning_rate: const(0.05)
      care: beta(2, 2)
      loss_aversion: beta(4, 3)
    budget: 500000000
    rates:
      base:
        send: 0.2
      diurnal: 0.3
    weights:
      send: 0.4
      buy_ada: 0.3
      sell_ada: 0.3
      register_stake: 0
      delegate: 0
      withdraw_rewards: 0
    hazards:
      birth: 0.003
      dormancy: lognormal(4, 0.8)
      abandon: 0.0001
      market: true
# The ADA market the wallets trade in (internal/market). A field left out
# takes this value, its default; times are seconds and rates per hour of
# simulated time, compressed so a run of minutes sees rallies and drawdowns.
markets:
  step: 10
  quote_every: 60
  # ADA/USD: a log random walk whose drift flips between bull and bear,
  # with downward-leaning jumps.
  ada: {start: 0.6, vol: 0.5, drift: 0.4, regime_rate: 2, jump_rate: 1, jump_mean: -0.02, jump_sd: 0.08}
  fx: {vol: 0.02, reversion: 1}
  # Each wallet's primary currency is drawn by share; usd is the USD one
  # unit buys at time zero.
  currencies:
    - {code: USD, share: 0.35, usd: 1}
    - {code: EUR, share: 0.2, usd: 1.08}
    - {code: JPY, share: 0.15, usd: 0.0067}
    - {code: KRW, share: 0.1, usd: 0.00074}
    - {code: GBP, share: 0.1, usd: 1.27}
    - {code: BRL, share: 0.1, usd: 0.2}
  # Spread is ask over bid; fee is the lovelace a withdrawal pays; float is
  # the hot wallet's budget.
  exchanges:
    - {name: north, spread: 0.004, fee: 500000, float: 50000000000, currencies: [USD, EUR, GBP], basis_vol: 0.003, basis_reversion: 4}
    - {name: harbor, spread: 0.006, fee: 300000, float: 50000000000, currencies: [USD, JPY, KRW], basis_vol: 0.003, basis_reversion: 4}
    - {name: summit, spread: 0.01, fee: 200000, float: 50000000000, currencies: [EUR, BRL, GBP, USD], basis_vol: 0.003, basis_reversion: 4}
  # The chance of each further preferred currency: most wallets have none.
  extra: 0.15
  venue: {conversion: 0.01, loyalty: 0.003, noise: 0.002}
  # Births of a currency scale by exp(beta * log return over window), clamped.
  births: {beta: 4, window: 300, min: 0.25, max: 4}
  # Opted-in wallets go dormant and abandon faster by exp(-beta * log
  # return over window), clamped; a hodl wallet takes that to the power
  # hodl, so it holds on. An abandoning wallet sells its ADA first.
  deaths: {beta: 3, window: 1800, min: 0.5, max: 4, hodl: 0.5}
