version: 1
profiles:
  # A casual holder: acts about once every ten seconds, mostly decides to
  # wait, and now and then pays another wallet.
  - name: holder
    kind: wallet
    agenda: hodl
    traits:
      competence: beta(8, 2)
      patience: lognormal(1.0, 0.5)
      learning_rate: const(0.05)
      care: beta(2, 2)
    budget: 1000000000
    rates:
      base:
        send: 0.1
      diurnal: 0.3
    weights:
      send: 1
    hazards:
      birth: 0.005
      dormancy: lognormal(5, 1)
      abandon: 0.00002
      # Dormancy onset and abandonment follow the market (markets.deaths).
      market: true
  # A busier spender with a smaller budget.
  - name: spender
    kind: wallet
    agenda: hodl
    traits:
      competence: beta(5, 3)
      patience: const(10)
      learning_rate: const(0.05)
      care: beta(2, 2)
    budget: 200000000
    rates:
      base:
        send: 0.5
      diurnal: 0.3
    weights:
      send: 1
    hazards:
      birth: 0.002
      dormancy: lognormal(4, 0.8)
      abandon: 0.0001
      market: true
  # A market trader: buys ADA on rallies and takes profit, and in a
  # drawdown sells or holds by its loss aversion and patience, where the
  # hodl profiles above always hold.
  - name: trader
    kind: wallet
    agenda: profit
    traits:
      competence: beta(8, 2)
      patience: lognormal(0.5, 0.8)
      learning_rate: const(0.05)
      care: beta(2, 2)
      loss_aversion: beta(4, 3)
    budget: 500000000
    rates:
      base:
        send: 0.2
      diurnal: 0.3
    weights:
      send: 0.4
      buy_ada: 0.3
      sell_ada: 0.3
      register_stake: 0
      delegate: 0
      withdraw_rewards: 0
    hazards:
      birth: 0.003
      dormancy: lognormal(4, 0.8)
      abandon: 0.0001
      market: true
# The ADA market the wallets trade in (internal/market). A field left out
# takes this value, its default; times are seconds and rates per hour of
# simulated time, compressed so a run of minutes sees rallies and drawdowns.
markets:
  step: 10
  quote_every: 60
  # ADA/USD: a log random walk whose drift flips between bull and bear,
  # with downward-leaning jumps. start is ADA/USD in the snapshot dated 2026-11-27.
  ada: {start: 0.146596, vol: 0.8, drift: 0.4, regime_rate: 2, jump_rate: 3, jump_mean: -0.02, jump_sd: 0.08}
  # The fallback for a currency that sets no vol or reversion of its own;
  # drift_scale multiplies each currency's yearly drift down to a run's span.
  fx: {vol: 0.02, reversion: 1, drift_scale: 0.2}
  # Each wallet's primary currency is drawn by share; the shares are
  # synthetic, not fitted. usd, vol, drift and reversion come from the
  # snapshot (make market-snapshot): the USD one unit buys, then its yearly
  # log vol, log drift against USD and mean reversion, one run hour a year.
  currencies:
    - {code: USD, share: 0.21, usd: 1}
    - {code: EUR, share: 0.13, usd: 1.0957, vol: 0.0668, drift: -0.0799, reversion: 3.12}
    - {code: GBP, share: 0.05, usd: 1.31215, vol: 0.0726, drift: -0.0123, reversion: 6.56}
    - {code: JPY, share: 0.08, usd: 0.00626802, vol: 0.0909, drift: -0.0292, reversion: 8.0}
    - {code: KRW, share: 0.06, usd: 0.00074912, vol: 0.1123, drift: 0.1304, reversion: 2.98}
    - {code: BRL, share: 0.07, usd: 0.181871, vol: 0.1966, drift: -0.0398, reversion: 6.28}
    - {code: MXN, share: 0.05, usd: 0.0512513, vol: 0.1047, drift: -0.0882, reversion: 0.94}
    - {code: ZAR, share: 0.03, usd: 0.0576838, vol: 0.1367, drift: -0.0135, reversion: 3.59}
    - {code: TRY, share: 0.05, usd: 0.0196901, vol: 0.0174, drift: -0.257, reversion: 2.3}
    - {code: ARS, share: 0.03, usd: 0.000626961, vol: 0.0999, drift: -0.099, reversion: 2.09}
    - {code: NGN, share: 0.05, usd: 0.000737813, vol: 0.0569, drift: 0.0643, reversion: 2.17}
    - {code: INR, share: 0.08, usd: 0.0107527, vol: 0.0645, drift: -0.0565, reversion: 2.08}
    - {code: IDR, share: 0.04, usd: 5.44129e-05, vol: 0.0597, drift: -0.1422, reversion: 8.0}
    - {code: PHP, share: 0.03, usd: 0.0156914, vol: 0.0671, drift: -0.116, reversion: 8.0}
    - {code: VND, share: 0.04, usd: 3.87642e-05, vol: 0.0193, drift: 0.0199, reversion: 4.22}
  # Spread is ask over bid; fee is the lovelace a withdrawal pays; float is
  # the hot wallet's budget.
  exchanges:
    - {name: north, spread: 0.004, fee: 500000, float: 50000000000, currencies: [USD, EUR, GBP, JPY, ZAR], basis_vol: 0.003, basis_reversion: 4}
    - {name: harbor, spread: 0.006, fee: 300000, float: 50000000000, currencies: [USD, JPY, KRW, INR, IDR, PHP, VND], basis_vol: 0.003, basis_reversion: 4}
    - {name: summit, spread: 0.01, fee: 200000, float: 50000000000, currencies: [USD, EUR, GBP, BRL, MXN, ARS, TRY], basis_vol: 0.003, basis_reversion: 4}
    - {name: bazaar, spread: 0.015, fee: 200000, float: 50000000000, currencies: [NGN, TRY, ZAR, INR, ARS, USD], basis_vol: 0.004, basis_reversion: 4}
  # The chance of each further preferred currency: most wallets have none.
  extra: 0.15
  venue: {conversion: 0.01, loyalty: 0.003, noise: 0.002}
  # Births of a currency scale by exp(beta * log return over window), clamped.
  births: {beta: 4, window: 300, min: 0.25, max: 4}
  # Opted-in wallets go dormant and abandon faster by exp(-beta * log
  # return over window), clamped; a hodl wallet takes that to the power
  # hodl, so it holds on. An abandoning wallet sells its ADA first.
  deaths: {beta: 3, window: 1800, min: 0.5, max: 4, hodl: 0.5}
# The people who own the wallets (profile.Humans). A wallet profile above
# supplies a wallet's mechanics; a human is the person behind one or more
# wallets: its motivation (the agenda of the wallet that founded it), wealth
# tier, how many wallets it keeps, and its household money. Every value is
# synthetic, chosen to be plausible, not fitted from chain data; a field
# left out takes this value, its default.
humans:
  # Simulated seconds per month: compressed so a short run sees paydays.
  month: 300
  max_wallets: 12
  # How strongly an owner spreads its wallets over different pools.
  spread: beta(2, 2)
  # share: of humans; wallets: mean extra wallets beyond the first;
  # income: monthly pay in USD; expenses: monthly bills as a share of
  # income; fiat: starting savings in USD; layoff and hire: monthly chances
  # of losing and finding a job; benefit: the share of pay while unemployed.
  tiers:
    - {name: low, share: 0.45, wallets: 0.2, income: "lognormal(7.3, 0.35)", expenses: "beta(19, 1)", fiat: "lognormal(5.5, 1)", layoff: 0.04, hire: 0.25, benefit: 0.3}
    - {name: mid, share: 0.35, wallets: 0.6, income: "lognormal(8.2, 0.3)", expenses: "beta(17, 3)", fiat: "lognormal(7.5, 1)", layoff: 0.02, hire: 0.3, benefit: 0.3}
    - {name: high, share: 0.15, wallets: 1.5, income: "lognormal(9.2, 0.3)", expenses: "beta(7, 3)", fiat: "lognormal(9.5, 1)", layoff: 0.01, hire: 0.4, benefit: 0.3}
    - {name: whale, share: 0.05, wallets: 3, income: "lognormal(10.5, 0.5)", expenses: "beta(3, 7)", fiat: "lognormal(12, 1)", layoff: 0.005, hire: 0.5, benefit: 0.5}
  # The share of disposable income (income less expenses) put into ADA,
  # every quarter month, once a month of expenses is kept in fiat.
  invest: {share: "beta(2, 8)", every: 0.25, buffer: 1}
