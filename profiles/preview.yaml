# markets: hand-added after the fit (see lab/README.md); refitting does not
# write it. Every trading cluster (all but the civic voter, whose agenda has
# no trade intents) opts into the market lifecycle, and gets a synthetic
# birth rate of 0.004 per second spread by cluster weight, plus a synthetic
# abandonment hazard of 0.00002 per second; neither is fitted from chain
# data. buy_ada and sell_ada keep the default weight 1, so the fitted
# weights still sum to 1; hodl clusters only buy and sell at a gain, and the
# dapp and yield clusters are the sellers in a drawdown.
# The ADA market the wallets trade in (internal/market). A field left out
# takes this value, its default; times are seconds and rates per hour of
# simulated time, compressed so a run of minutes sees rallies and drawdowns.
markets:
  step: 10
  quote_every: 60
  # ADA/USD, the currencies' rates and dynamics and the exchanges take their
  # defaults: rates are seeded from a snapshot of live FX and ADA prices
  # (make market-snapshot), the shares are synthetic.
  # The chance of each further preferred currency: most wallets have none.
  extra: 0.15
  venue: {conversion: 0.01, loyalty: 0.003, noise: 0.002}
  # Births of a currency scale by exp(beta * log return over window), clamped.
  births: {beta: 4, window: 300, min: 0.25, max: 4}
  # Opted-in wallets go dormant and abandon faster by exp(-beta * log
  # return over window), clamped; a hodl wallet takes that to the power
  # hodl, so it holds on. An abandoning wallet sells its ADA first.
  deaths: {beta: 3, window: 1800, min: 0.5, max: 4, hodl: 0.5}
